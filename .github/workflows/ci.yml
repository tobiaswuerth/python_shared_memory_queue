name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run catches breakage from new Python, NumPy, or runner images.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      # The coverage gate in pyproject.toml requires 100% on every platform.
      - run: python -m pytest --cov --cov-report=term-missing
      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install ".[test,benchmark]" build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl | tee wheel-contents.txt
          grep -q "memory/py.typed" wheel-contents.txt
      - name: Test source distribution
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as directory:
              with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
                  archive.extractall(directory, filter="data")
              source = next(Path(directory).glob("*/pyproject.toml")).parent
              subprocess.run([sys.executable, "-m", "pytest", "-q"], cwd=source, check=True)
          PY
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install --no-deps dist/*.whl
          /tmp/wheel-check/bin/python -I examples/basic.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  ci-success:
    name: CI success
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
