name: Benchmark

# Compares py-sharedmemory with multiprocessing.Queue on each major platform. GitHub-hosted
# runners are shared virtual machines, so read the speedups, not the absolute throughput.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repeats:
        description: Paired runs per payload size; more runs narrow the confidence intervals
        default: "20"
  pull_request:
    paths:
      - "benchmarks/*.py"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SIZES: "1000 10000 100000 1000000 10000000 100000000"
  # Pull requests only check that the benchmark works; six runs give the first 95% interval.
  REPEATS: ${{ github.event_name == 'pull_request' && '6' || inputs.repeats || '20' }}
  # The tables use × and –, which Windows' default encoding would garble in job summaries.
  PYTHONUTF8: "1"

jobs:
  benchmark:
    name: Benchmark (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: "Linux x64", file: linux-x64 }
          - { os: ubuntu-24.04-arm, label: "Linux arm64", file: linux-arm64 }
          - { os: windows-latest, label: "Windows x64", file: windows-x64 }
          - { os: windows-11-arm, label: "Windows arm64", file: windows-arm64 }
          - { os: macos-latest, label: "macOS arm64", file: macos-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Measuring needs only NumPy; the summary job draws the chart.
      - run: python -m pip install -e . numpy
      - name: Benchmark
        shell: bash
        run: >-
          python -m benchmarks.benchmark --sizes $SIZES --repeats "$REPEATS"
          --label "${{ matrix.label }}" --json "${{ matrix.file }}.json"
      - name: Job summary
        shell: bash
        run: python -m benchmarks.compare "${{ matrix.file }}.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.file }}
          path: ${{ matrix.file }}.json

  summary:
    name: Benchmark summary
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[benchmark]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchmark-*
          merge-multiple: true
          path: results
      - name: Speedup matrix
        shell: bash
        run: |
          reports=()
          for name in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-arm64; do
            if [ -f "results/$name.json" ]; then reports+=("results/$name.json"); fi
          done
          version=$(python -c "import py_sharedmemory; print(py_sharedmemory.__version__)")
          subtitle="GitHub-hosted runners · py-sharedmemory $version · Python 3.14 · NumPy float32"
          subtitle="$subtitle · capacity 2 · median of $REPEATS paired runs · $(date -u +%Y-%m-%d)"
          {
            echo "## Speedup over multiprocessing.Queue"
            echo
            python -m benchmarks.compare "${reports[@]}" --image results/platforms.png \
              --subtitle "$subtitle"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-summary
          path: results/
