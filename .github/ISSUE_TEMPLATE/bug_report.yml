name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the full traceback or error output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A short script that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: py-sharedmemory version
      description: 'Shown by `python -c "import py_sharedmemory; print(py_sharedmemory.__version__)"`'
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: start-method
    attributes:
      label: Multiprocessing start method
      options: [spawn, fork, forkserver, Not sure]
  - type: textarea
    id: environment
    attributes:
      label: Anything else?
      description: For example, running in Docker, payload sizes, or capacity.
