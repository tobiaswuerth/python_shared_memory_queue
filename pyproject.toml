[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "py-sharedmemory"
dynamic = ["version"]
description = "Fast multiprocessing.Queue alternative that moves large Python objects and NumPy arrays through shared memory"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tobias Würth" }]
keywords = [
    "shared-memory",
    "multiprocessing",
    "queue",
    "multiprocessing-queue",
    "ipc",
    "inter-process-communication",
    "numpy",
    "pickle",
    "data-pipeline",
    "machine-learning",
    "reinforcement-learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tobiaswuerth/python_shared_memory_queue"
Documentation = "https://github.com/tobiaswuerth/python_shared_memory_queue#readme"
Repository = "https://github.com/tobiaswuerth/python_shared_memory_queue"
Changelog = "https://github.com/tobiaswuerth/python_shared_memory_queue/blob/main/CHANGELOG.md"
Releases = "https://github.com/tobiaswuerth/python_shared_memory_queue/releases"
Issues = "https://github.com/tobiaswuerth/python_shared_memory_queue/issues"

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1", "pytest-timeout>=2.3", "numpy>=1.26"]
benchmark = ["numpy>=1.26", "matplotlib>=3.8"]
dev = [
    "py-sharedmemory[test,benchmark]",
    "basedpyright>=1.29",
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ruff>=0.15",
    "twine>=5",
]

[tool.setuptools]
packages = ["py_sharedmemory"]

[tool.setuptools.dynamic]
version = { attr = "py_sharedmemory.__version__" }

[tool.setuptools.package-data]
py_sharedmemory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
timeout = 45
xfail_strict = true
filterwarnings = [
    "error",
    # A thread that one test joined can still be leaving the OS when the next one forks,
    # and fork() warns about every thread it counts. The fork tests fork on purpose.
    "ignore:This process .* is multi-threaded, use of fork:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["py_sharedmemory"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "PIE", "PT", "RUF"]
allowed-confusables = ["×", "–"]  # Speedups and ranges in benchmark reports

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["py_sharedmemory"]

# Pyright, basedpyright and Pylance read this, so editors and CI report the same findings.
# Tests are left out, also when opened in an editor: they pass stand-in queues and inspect
# private state on purpose. Ruff still lints them.
[tool.pyright]
include = ["py_sharedmemory", "examples", "benchmarks"]
ignore = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["py_sharedmemory", "examples"]
enableTypeIgnoreComments = true
